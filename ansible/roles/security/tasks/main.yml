---
- name: Deploy AtlasForge SSH security policy
  ansible.builtin.template:
    src: 99-atlasforge-security.conf.j2
    dest: /etc/ssh/sshd_config.d/99-atlasforge-security.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: true
  notify: Restart SSH

- name: Configure host firewall
  ansible.builtin.include_tasks: firewall.yml
