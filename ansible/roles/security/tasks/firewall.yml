---
- name: Allow SSH from trusted admin IP
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    from_ip: 145.40.130.252

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
